<body>
  <script>
    

    let number = [1,4,3,5,2,6]

    for(let i = 0; i < number.length; i++){
      if(number[i] % 2){
        console.log("Odd " + number[i])
      }
      else{
        console.log("Even " + number[i])
        
    }
    }
  </script>
